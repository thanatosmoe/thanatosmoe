name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: thanatosmoe
          template: classic
          base: header
          config_timezone: Asia/Hong_Kong

          config_footer: no

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage

          plugin_rss: yes
          plugin_rss_source: https://blog.thanatos73.top/rss.xml
          plugin_rss_limit: 4
